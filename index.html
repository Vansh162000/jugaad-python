<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jugaad Python</title>
<meta name="description" content="Reels jaisi Python practice: concept samjho, code likho, tests pass karo.">

<style>
:root{
  --ink:#13212E; --paper:#EEF3F7; --yellow:#FFD43B; --blue:#3776AB; --mint:#5CC9A7; --coral:#F2785C;
  --violet:#6A4BD8; --sky:#8EC5F0; --pink:#F49AC1; --night:#0E1824;
  --bg:#13212E; --surface:#1C2E3E; --text:#EEF3F7; --muted:#B4C3D0; --line:#2E4558;
  --font:"Baloo 2", ui-rounded, "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){--bg:#EEF3F7;--surface:#FFFFFF;--text:#13212E;--muted:#4D6375;--line:#D3DEE7;color-scheme:light}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit}
p{margin:0}
code{font-family:var(--mono);font-size:.88em;background:color-mix(in srgb,currentColor 14%,transparent);padding:1px 5px;border-radius:6px}

#feed{height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior-y:contain;scrollbar-width:none}
#feed::-webkit-scrollbar{display:none}
#feed.typing{scroll-snap-type:none}
.card{--c-bg:var(--paper);--c-fg:var(--ink);background:var(--c-bg);color:var(--c-fg);height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;display:flex}
.card .inner{flex:1;overflow-y:auto;width:100%;max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:14px;
  padding:calc(env(safe-area-inset-top,0px) + 62px) 20px calc(env(safe-area-inset-bottom,0px) + 92px)}
.t-learn1{--c-bg:var(--paper)} .t-learn2{--c-bg:var(--yellow)} .t-predict{--c-bg:var(--sky)}
.t-fill{--c-bg:var(--mint)} .t-bug{--c-bg:var(--coral)} .t-write{--c-bg:var(--ink);--c-fg:var(--paper)}
.t-redo{--c-bg:var(--ink);--c-fg:var(--paper)} .t-test{--c-bg:var(--violet);--c-fg:#FFFFFF}
.t-review{--c-bg:var(--pink)} .t-deep{--c-bg:var(--yellow)} .t-mcq{--c-bg:var(--pink)} .t-iv{--c-bg:var(--blue);--c-fg:#FFFFFF} .t-next{--c-bg:var(--blue);--c-fg:#FFFFFF} .t-note{--c-bg:var(--paper)}
.t-write .inner,.t-redo .inner{border-inline:3px solid var(--yellow)}

.chip{align-self:flex-start;border:2px solid currentColor;border-radius:999px;padding:1px 12px;font-weight:700;font-size:.95rem}
.big{font-size:clamp(2.4rem,11vw,4.2rem);font-weight:800;line-height:1;margin:4px 0 0;letter-spacing:-.01em}
.say{font-size:clamp(1.45rem,6vw,2.1rem);font-weight:700;line-height:1.2;margin:2px 0 0}
.mean{font-size:1.2rem;font-weight:600}
.task{font-size:1.12rem;font-weight:600}
.hint,.muted{opacity:.82}
.small{font-size:.9rem}
.lbl{font-size:.88rem;font-weight:800;opacity:.8;margin-bottom:4px}
.sec{display:grid;gap:8px}
ul.pts{margin:0;padding-left:1.2em;display:grid;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.btn{border:2px solid var(--c-fg);background:transparent;color:var(--c-fg);border-radius:999px;padding:9px 18px;min-height:46px;font-weight:700;font-size:1rem;cursor:pointer;touch-action:manipulation}
.btn.main{background:var(--c-fg);color:var(--c-bg)}
.btn.tiny{min-height:34px;padding:2px 12px;font-size:.88rem}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.opt:focus-visible,summary:focus-visible,textarea:focus-visible{outline:3px solid var(--c-fg);outline-offset:3px}

.codebox,.outbox{margin:0;background:var(--night);color:#E6EDF3;font-family:var(--mono);font-size:.9rem;line-height:1.5;border-radius:16px;padding:12px 14px;overflow-x:auto;white-space:pre;tab-size:4}
.outbox{background:#06101A;color:#B8F5C8;white-space:pre-wrap;border:1px dashed #2E4558}
.outbox.bad{color:#FFB4A8}
.cb{display:grid;gap:8px}
.cb .row.locked{display:none}

.ed{display:grid;gap:8px}
.editor{display:flex;background:var(--night);border-radius:16px;overflow:hidden}
.gutter{margin:0;padding:12px 6px 12px 10px;color:#5E7487;text-align:right;font-family:var(--mono);font-size:.9rem;line-height:1.5;user-select:none;white-space:pre;overflow:hidden;min-width:2.4em}
.gutter .bad{color:#FF8A80;font-weight:700}
textarea.code{flex:1;min-width:0;background:transparent;color:#E6EDF3;border:0;outline:none;resize:none;font-family:var(--mono);font-size:.9rem;line-height:1.5;padding:12px 12px 12px 6px;white-space:pre;overflow:auto;tab-size:4}
.keys{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.keys button{flex:none;font-family:var(--mono);min-width:40px;min-height:38px;border-radius:10px;border:2px solid var(--c-fg);background:transparent;color:var(--c-fg);font-weight:600;cursor:pointer}

.out{display:grid;gap:10px}
.fb{background:color-mix(in srgb,var(--c-fg) 12%,transparent);border-radius:18px;padding:12px 14px;display:grid;gap:6px}
.strong{font-weight:700;font-size:1.08rem}
.hit,.miss{font-weight:800;font-size:1.25rem}
.wait{opacity:.75}
ul.res{list-style:none;margin:0;padding:0;display:grid;gap:6px}
ul.res li{font-family:var(--mono);font-size:.85rem;overflow-wrap:anywhere}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--c-fg);border-radius:14px;background:transparent;color:var(--c-fg);padding:8px 12px;cursor:pointer}
.opt pre{margin:0;font-family:var(--mono);font-size:.92rem;white-space:pre-wrap}
.opt.right{background:#16834A;border-color:#16834A;color:#fff}
.opt.wrong{background:#B3261E;border-color:#B3261E;color:#fff}
.opts{display:grid;gap:8px}
.stars{font-size:2.6rem;letter-spacing:4px;line-height:1}
.dots{display:flex;gap:6px}
.dots span{width:28px;height:6px;border-radius:9px;background:color-mix(in srgb,var(--c-fg) 30%,transparent)}
.dots span.on{background:var(--c-fg)}
.stamp{align-self:flex-start;border:2px dashed currentColor;border-radius:14px;padding:6px 14px;font-weight:800;transform:rotate(-2deg);animation:stamp .35s ease-out}
@keyframes stamp{from{transform:rotate(-8deg) scale(1.4);opacity:0}}
.field{width:100%;font:inherit;font-size:1rem;padding:10px 12px;border-radius:14px;border:2px solid var(--c-fg);background:transparent;color:var(--c-fg);resize:vertical}
.field::placeholder{color:currentColor;opacity:.6}
.secret{border:2px dashed currentColor;border-radius:18px;padding:12px 14px;display:grid;gap:8px}

.hud{position:fixed;inset:0 0 auto;z-index:20;display:flex;justify-content:center;gap:6px;padding:calc(env(safe-area-inset-top,0px) + 10px) 8px 8px;pointer-events:none}
.pill{pointer-events:auto;background:rgba(19,33,46,.86);color:#EEF3F7;border:0;border-radius:999px;padding:4px 11px;font-weight:700;font-size:.92rem;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-variant-numeric:tabular-nums}
.pill.risk{box-shadow:inset 0 0 0 2px var(--yellow)}
.tabs{position:fixed;inset:auto 0 0;z-index:20;display:flex;justify-content:center;gap:6px;padding:8px 8px calc(env(safe-area-inset-bottom,0px) + 10px);pointer-events:none}
.tabs button{pointer-events:auto;background:rgba(19,33,46,.9);color:#EEF3F7;border:0;border-radius:999px;padding:9px 14px;font-weight:700;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.tabs button:focus-visible,.pill:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

.sheet{border:0;padding:0;width:100%;max-width:720px;height:100dvh;max-height:100dvh;margin:0 auto;background:var(--bg);color:var(--text);--c-bg:var(--bg);--c-fg:var(--text)}
.sheet::backdrop{background:rgba(5,12,20,.6)}
.sheet-in{height:100%;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px calc(env(safe-area-inset-bottom,0px) + 40px);display:grid;gap:0;align-content:start}
.sheet h2{font-size:1.9rem;line-height:1.1;margin:8px 0 4px}
.sheet h3{font-size:1.2rem;margin:0 0 8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;margin:12px 0;display:grid;gap:8px}
.panel label{display:block;font-weight:700;margin:6px 0 2px}
.panel select,.panel input:not([type=checkbox]){width:100%;font:inherit;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--text)}
.check{display:flex!important;gap:8px;align-items:center;font-weight:600!important}
.check input{width:20px;height:20px}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;background:var(--yellow)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kpi{background:var(--bg);border-radius:14px;padding:10px}
.kpi b{display:block;font-size:1.5rem;line-height:1.1}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.badge{border:1px solid var(--line);border-radius:14px;padding:8px 10px}
.badge.off{opacity:.38}
.badge b{display:block}
ul.clean{list-style:none;padding:0;margin:0}
ul.clean>li{border-bottom:1px solid var(--line);padding:12px 0;display:grid;gap:6px}
ul.clean>li:last-child{border-bottom:0}
.top{display:flex;justify-content:flex-end;position:sticky;top:0;z-index:2}
.lock{opacity:.5}

.loot{--c-bg:var(--yellow);--c-fg:var(--ink);background:var(--c-bg);color:var(--c-fg);border:0;border-radius:28px;padding:26px;max-width:340px;text-align:center}
.loot::backdrop{background:rgba(5,12,20,.65)}
.loot-emoji{font-size:4rem;line-height:1}
.loot h2{margin:8px 0}
.loot p{margin-bottom:16px}
#toasts{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);left:0;right:0;z-index:40;display:grid;justify-items:center;gap:6px;pointer-events:none}
.toast{background:#EEF3F7;color:#13212E;border-radius:999px;padding:6px 16px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:toast 2.8s forwards;max-width:92vw;text-align:center}
.toast.xp{background:var(--yellow)}
@keyframes toast{0%{opacity:0;transform:translateY(8px)}10%,82%{opacity:1;transform:none}100%{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style>

<body>
<header class="hud" aria-label="Aaj ki progress">
  <span class="pill" id="hStreak" title="Streak">🔥 0</span>
  <span class="pill" id="hFreeze" title="Streak freezes">🧊 2</span>
  <span class="pill" id="hGoal" title="Daily goal">🎯 0/3</span>
  <span class="pill" id="hXP" title="Level">⚡ L1</span>
  <button class="pill" id="hPy" title="Python engine">🐍 ⏳</button>
</header>

<main id="feed" aria-label="Python practice feed" tabindex="-1"></main>

<nav class="tabs" aria-label="Sections">
  <button id="tMap">🗺️ Map</button>
  <button id="tFeed">⬆️ Feed</button>
  <button id="tLab">🧪 Lab</button>
  <button id="tMe">🙂 Me</button>
</nav>

<dialog id="sheetMap" class="sheet" aria-label="Course map"><div class="sheet-in" id="mapBody"></div></dialog>
<dialog id="sheetLab" class="sheet" aria-label="Python lab"><div class="sheet-in" id="labBody"></div></dialog>
<dialog id="sheetMe" class="sheet" aria-label="Profile and settings"><div class="sheet-in" id="meBody"></div></dialog>
<dialog id="loot" class="loot" aria-labelledby="lootTitle">
  <p class="loot-emoji" id="lootEmoji">🎁</p><h2 id="lootTitle"></h2><p id="lootText"></p>
  <button class="btn main" id="lootOk">Le liya!</button>
</dialog>
<div id="toasts" aria-live="polite"></div>
<noscript><p style="padding:2rem">Is app ko chalane ke liye JavaScript on karo.</p></noscript>

<script src="content.js"></script>
<script>
"use strict";
/* ================= HELPERS ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const md = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const today = (o = 0) => { const d = new Date(); d.setDate(d.getDate() + o);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const daysBetween = (a, b) => Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 864e5);
function toast(msg, cls = "") { const t = document.createElement("div"); t.className = "toast " + cls; t.textContent = msg; $("#toasts").append(t); setTimeout(() => t.remove(), 2900); }

/* ================= CONTENT INDEX ================= */
const CONCEPTS = window.CONCEPTS || [];
const CBY = Object.fromEntries(CONCEPTS.map((c, i) => [c.id, {...c, idx:i}]));
const TASK = {}; CONCEPTS.forEach(c => c.tasks.forEach(t => { TASK[t.id] = {...t, cid:c.id}; }));
const QB = {}; CONCEPTS.forEach(c => c.test.forEach((q, i) => { QB[c.id + "-q" + i] = {...q, cid:c.id}; }));
const INTERVALS = [1, 2, 4, 7, 14, 30];
const GOAL = 3;
const LEVELS = ["Print wala","Variable veer","Loop master","Function fighter","Debugger","Pythonista","Code ninja","Data wizard","AI engineer"];

/* ================= STATE ================= */
const STORE = "jp_v1";
const DEFAULT = {v:1,xp:0,streak:0,lastGoalDay:"",freezes:2,freezeDay:"",day:"",cardsToday:0,mysteryDay:"",total:0,
  lines:0,linesDay:"",linesToday:0,clean:0,badges:{},done:{},stars:{},secrets:{},unlocked:0,cur:CONCEPTS[0]?.id,
  review:{},redo:{},drafts:{},typeCount:{},gen:{},topics:{},lab:"# Yahan kuch bhi try karo\nprint('Hello, Jugaad!')\n",seenIntro:false};
function load() { let s = null; try { s = JSON.parse(localStorage.getItem(STORE)); } catch {} return Object.assign(JSON.parse(JSON.stringify(DEFAULT)), s || {}); }
let S = load();
const titleOf = cid => CBY[cid]?.title || S.topics?.[cid]?.title || "AI topic";
if (!CBY[S.cur]) S.cur = CONCEPTS[0].id;
let saveTimer = null;
function save() { clearTimeout(saveTimer); try { localStorage.setItem(STORE, JSON.stringify(S)); } catch { toast("Progress save nahi hua — browser storage full ya block hai."); } hud(); }
function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(save, 700); }
const level = () => 1 + Math.floor(S.xp / 200);
const levelName = () => LEVELS[Math.min(level() - 1, LEVELS.length - 1)];
function shownStreak() { if (!S.lastGoalDay) return 0; const gap = daysBetween(S.lastGoalDay, today()); return gap <= 1 || gap - 1 <= S.freezes ? S.streak : 0; }
function dayRoll() { if (S.day !== today()) { S.day = today(); S.cardsToday = 0; } if (S.linesDay !== today()) { S.linesDay = today(); S.linesToday = 0; } }
function hud() {
  const st = shownStreak(), doneToday = S.lastGoalDay === today();
  $("#hStreak").textContent = "🔥 " + st; $("#hStreak").classList.toggle("risk", !doneToday && st > 0);
  $("#hFreeze").textContent = "🧊 " + S.freezes;
  $("#hGoal").textContent = "🎯 " + Math.min(S.day === today() ? S.cardsToday : 0, GOAL) + "/" + GOAL;
  $("#hXP").textContent = "⚡ L" + level();
}

/* ================= PYTHON ENGINE ================= */
let worker = null, pyState = "loading", seq = 0;
const pending = new Map(), waiters = [];
function setPy(state) { pyState = state; $("#hPy").textContent = state === "ready" ? "🐍 ✓" : state === "fail" ? "🐍 ✗" : "🐍 ⏳";
  $("#hPy").title = state === "ready" ? "Python ready" : state === "fail" ? "Python load nahi hua — tap karke dobara try karo" : "Python load ho raha hai"; }
function startWorker() {
  setPy("loading");
  worker = new Worker("py-worker.js");
  worker.onmessage = e => {
    const m = e.data;
    if (m.type === "ready") { setPy("ready"); waiters.splice(0).forEach(w => w.ok()); }
    else if (m.type === "fatal") { setPy("fail"); waiters.splice(0).forEach(w => w.no(new Error(m.error))); }
    else if (m.type === "started") { const p = pending.get(m.id); if (p) { clearTimeout(p.t); p.t = setTimeout(() => killRun(m.id), 5000); } }
    else if (m.type === "result") { const p = pending.get(m.id); if (p) { clearTimeout(p.t); pending.delete(m.id); p.resolve(m.res); } }
  };
  worker.onerror = () => { setPy("fail"); waiters.splice(0).forEach(w => w.no(new Error("worker"))); };
}
$("#hPy").onclick = () => { if (pyState === "fail") { worker?.terminate(); startWorker(); } else toast(pyState === "ready" ? "🐍 Python ready hai" : "🐍 Python load ho raha hai (pehli baar ~10 MB)…"); };
function killRun(id) {
  if (!pending.has(id)) return;
  worker.terminate(); worker = null;
  for (const [, p] of pending) { clearTimeout(p.t); p.resolve({timeout:true}); } pending.clear();
  startWorker();
}
async function runPy(code, tests = [], setup = "") {
  if (!worker) startWorker();
  if (pyState !== "ready") await new Promise((ok, no) => waiters.push({ok, no}));
  return new Promise(resolve => {
    const id = ++seq;
    const t = setTimeout(() => killRun(id), 120000); // packages (numpy etc.) load hone ka time; code ka 5 sec timer "started" ke baad
    pending.set(id, {resolve, t});
    worker.postMessage({id, code, tests, setup});
  });
}
const FRIENDLY = {
  NameError:"Python ko yeh naam nahi mila. Spelling check karo, variable pehle banao — aur agar code mein `___` bacha hai toh use bharo.",
  SyntaxError:"Code ki 'grammar' galat hai. Colon (:), bracket, quote, ya bacha hua `___` check karo.",
  IndentationError:"Spacing galat hai. `if/for/def` ke andar wali lines 4 space aage honi chahiye, aur ek block ki saari lines barabar.",
  TabError:"Tabs aur spaces mix ho gaye. Sirf 4 spaces use karo (⇥ button).",
  TypeError:"Galat type ki cheezein mila di — jaise string + int, ya None par kaam karna. Values ke types check karo.",
  IndexError:"List mein utna index hai hi nahi. Index 0 se shuru hota hai; length `len()` se check karo.",
  KeyError:"Dict mein yeh key nahi hai. `.get(key, default)` use karo ya pehle key check karo.",
  ZeroDivisionError:"0 se divide kar rahe ho. Pehle check karo ki divisor 0 to nahi.",
  ValueError:"Type sahi hai par value galat — jaise `int('abc')`.",
  AttributeError:"Is object par yeh method/attribute nahi hota — jaise list par `.upper()`, ya None par kuch bhi.",
  UnboundLocalError:"Function ke andar variable ko value dene se pehle use kar liya.",
  RecursionError:"Function khud ko bina ruke call kar raha hai — base case check karo.",
  AssertionError:"Tumhara `assert` fail hua — condition sach nahi nikli.",
  ModuleNotFoundError:"Yeh module is browser-Python mein nahi hai. Week 1 ke liye standard library kaafi hai.",
  OSError:"`input()` is app mein nahi chalta — value seedha variable mein likh do."
};
const friendly = t => FRIENDLY[t] || "Error ka naam aur message dhyan se padho — neeche wali line hi asli wajah batati hai.";
function runText(res) {
  if (res.timeout) return {txt:"⏱️ 5 second se zyada chala — shayad infinite loop hai (while ki condition kabhi False nahi hui?). Code rok diya.", bad:true};
  let txt = res.out || "";
  if (res.err) txt += (txt ? "\n" : "") + `❌ ${res.err.type}${res.err.line ? " (line " + res.err.line + ")" : ""}: ${res.err.msg}\n💡 ${friendly(res.err.type).replace(/`/g, "")}`;
  return {txt: txt || "(kuch print nahi hua — print() lagao)", bad: !!res.err};
}

/* ================= CODE EDITOR ================= */
const KEYS = [["tab","⇥"],["(","("],[")",")"],[":",":"],["[","["],["]","]"],['"','"'],["'","'"],["=","="],["_","_"],[".","."],[",",","],["{","{"],["}","}"],["#","#"]];
const editorHTML = () => `<div class="ed"><div class="editor"><pre class="gutter" aria-hidden="true"></pre><textarea class="code" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off" aria-label="Python code editor (Esc dabake bahar niklo)"></textarea></div>
<div class="keys" aria-label="Code symbols">${KEYS.map(([k, l]) => `<button type="button" data-k="${esc(k)}" aria-label="${k === "tab" ? "4 spaces" : esc(k)}">${esc(l)}</button>`).join("")}</div></div>`;
function insertAt(ta, text) { ta.setRangeText(text, ta.selectionStart, ta.selectionEnd, "end"); ta.dispatchEvent(new Event("input")); }
function setupEditor(root, value, onChange) {
  const ta = root.querySelector("textarea.code"), gut = root.querySelector(".gutter");
  let bad = 0;
  const paint = () => { const n = ta.value.split("\n").length; let h = "";
    for (let i = 1; i <= n; i++) h += (i === bad ? `<span class="bad">${i}</span>` : i) + "\n";
    gut.innerHTML = h; ta.rows = Math.min(18, Math.max(6, n + 1)); gut.scrollTop = ta.scrollTop; };
  ta.value = value; paint();
  ta.addEventListener("input", () => { bad = 0; paint(); onChange?.(ta.value); });
  ta.addEventListener("scroll", () => { gut.scrollTop = ta.scrollTop; });
  ta.addEventListener("keydown", e => {
    const s = ta.selectionStart, v = ta.value, ls = v.lastIndexOf("\n", s - 1) + 1, before = v.slice(ls, s);
    if (e.key === "Escape") { ta.blur(); return; }
    if (e.key === "Tab" && !e.shiftKey) { e.preventDefault(); insertAt(ta, "    "); }
    else if (e.key === "Tab" && e.shiftKey) { e.preventDefault(); const m = v.slice(ls).match(/^ {1,4}/);
      if (m) { ta.setRangeText("", ls, ls + m[0].length, "preserve"); ta.selectionStart = ta.selectionEnd = Math.max(ls, s - m[0].length); ta.dispatchEvent(new Event("input")); } }
    else if (e.key === "Enter" && !e.ctrlKey && !e.metaKey) { e.preventDefault(); let ind = (before.match(/^ */) || [""])[0];
      if (/:\s*$/.test(before)) ind += "    "; insertAt(ta, "\n" + ind); }
    else if (e.key === "Backspace" && ta.selectionStart === ta.selectionEnd && before.length && /^ +$/.test(before) && before.length % 4 === 0) {
      e.preventDefault(); ta.setRangeText("", s - 4, s, "end"); ta.dispatchEvent(new Event("input")); }
  });
  root.querySelectorAll(".keys button").forEach(b => { b.addEventListener("pointerdown", ev => ev.preventDefault());
    b.onclick = () => { ta.focus(); insertAt(ta, b.dataset.k === "tab" ? "    " : b.dataset.k); }; });
  return {get:() => ta.value, set:v => { ta.value = v; bad = 0; paint(); onChange?.(v); }, mark:n => { bad = n || 0; paint(); }};
}

const PROVIDERS = {
  gemini:{label:"Gemini", keyRe:/^(?:AIza|AQ\.)[A-Za-z0-9._-]+$/, keyHint:"AIza… ya AQ.…", def:"gemini-3.1-flash-lite"},
  groq:{label:"Groq", keyRe:/^gsk_[A-Za-z0-9._-]+$/, keyHint:"gsk_…", def:"openai/gpt-oss-20b"},
  xai:{label:"Grok (xAI)", keyRe:/^xai-[A-Za-z0-9._-]+$/, keyHint:"xai-…", def:""},
  ollama:{label:"Ollama (local)", keyRe:null, keyHint:"", def:""}
};
const AIS = {remember:false, list:[]}; // list order = try order
try {
  localStorage.removeItem("jfa_user_api_key");
  const raw = JSON.parse(localStorage.getItem("jf_ai") || sessionStorage.getItem("jf_ai") || "null");
  if (raw && Array.isArray(raw.list)) { AIS.remember = !!raw.remember; AIS.list = raw.list.filter(c => c && PROVIDERS[c.provider]); }
  else if (raw && (raw.key || raw.provider === "ollama")) { // v3.0 single-key settings
    AIS.remember = !!raw.remember;
    AIS.list = [{id:"c" + Date.now(), provider: raw.provider === "ollama" ? "ollama" : (raw.key || "").startsWith("gsk_") ? "groq" : "gemini",
      key:raw.key || "", model:raw.model || "", url:raw.ollama || "http://localhost:11434"}];
  }
} catch {}
function persistAI() {
  try {
    localStorage.removeItem("jf_ai"); sessionStorage.removeItem("jf_ai");
    if (!AIS.list.length) return;
    (AIS.remember ? localStorage : sessionStorage).setItem("jf_ai", JSON.stringify({remember:AIS.remember, list:AIS.list}));
  } catch {}
}
const aiReady = () => AIS.list.length > 0;
const modelOf = c => c.model || PROVIDERS[c.provider].def;
const connLabel = c => PROVIDERS[c.provider].label + (modelOf(c) ? " · " + modelOf(c) : "");
const sleep = ms => new Promise(r => setTimeout(r, ms));
const cool = {}; // connection id -> time until which it is tried last
const TRANSIENT = [408, 429, 500, 502, 503, 504];
const isRetryable = e => TRANSIENT.includes(e?.status) || e?.name === "TimeoutError" || e?.name === "AbortError" || e instanceof TypeError;

function httpError(status, b) {
  const bad = b?.error?.details?.some?.(d => d.reason === "API_KEY_INVALID");
  const m = status === 401 || bad ? "Key reject ho gayi (401)."
    : status === 403 ? "Access denied (403)."
    : status === 404 ? "Model nahi mila (404)."
    : status === 429 ? "Limit khatam (429)."
    : status === 503 ? "Server busy (503)."
    : "Error (HTTP " + status + ").";
  const e = new Error(m); e.status = status; return e;
}
function parseJSON(raw) {
  const t = String(raw || "").replace(/^\s*```(?:json)?/i, "").replace(/```\s*$/, "").trim();
  try { return JSON.parse(t); } catch {}
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  if (a >= 0 && b > a) return JSON.parse(t.slice(a, b + 1));
  throw new SyntaxError("not json");
}
async function callOne(c, instruction, payload, fields, tmo) {
  const message = JSON.stringify(payload), model = modelOf(c);
  let url, headers = {"Content-Type":"application/json"}, body;
  const chat = [{role:"system", content:instruction + " Reply with JSON only."}, {role:"user", content:message}];
  if (c.provider === "gemini") {
    url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`;
    headers["x-goog-api-key"] = c.key;
    body = {systemInstruction:{parts:[{text:instruction}]}, contents:[{role:"user",parts:[{text:message}]}], generationConfig:{responseMimeType:"application/json"}};
  } else if (c.provider === "groq") {
    url = "https://api.groq.com/openai/v1/chat/completions"; headers.Authorization = "Bearer " + c.key;
    body = {model, response_format:{type:"json_object"}, messages:chat};
  } else if (c.provider === "xai") {
    if (!model) throw new Error("Grok ke liye Model ID chahiye.");
    url = "https://api.x.ai/v1/chat/completions"; headers.Authorization = "Bearer " + c.key;
    body = {model, messages:chat};
  } else {
    if (!model) throw new Error("Ollama ka model chuno.");
    url = (c.url || "http://localhost:11434").replace(/\/+$/, "") + "/api/chat";
    body = {model, stream:false, format:"json", messages:chat};
  }
  const res = await fetch(url, {method:"POST", headers, body:JSON.stringify(body), signal:AbortSignal.timeout(tmo || (c.provider === "ollama" ? 90000 : 15000))});
  if (!res.ok) throw httpError(res.status, await res.json().catch(() => null));
  const data = await res.json();
  const raw = c.provider === "gemini" ? (data.candidates?.[0]?.content?.parts || []).filter(x => x.text && !x.thought).map(x => x.text).join("")
    : c.provider === "ollama" ? data.message?.content : data.choices?.[0]?.message?.content;
  const result = parseJSON(raw);
  if (!fields) return result;
  if (!result || !fields.every(f => typeof result[f] === "string" && result[f].trim())) throw new Error("Jawab adhoora tha.");
  return Object.fromEntries(fields.map(f => [f, result[f].trim().slice(0, 900)]));
}
// Tries each connection in order; skips busy ones to the end; one quick retry on 5xx.
async function askAIMeta(instruction, payload, fields, only, long) {
  const now = Date.now();
  const list = only ? [only] : [...AIS.list].sort((a, b) => ((cool[a.id] || 0) > now) - ((cool[b.id] || 0) > now));
  if (!list.length) throw new Error("AI connected nahi hai.");
  const failed = [];
  for (const c of list) {
    for (let attempt = 0; attempt < 2; attempt++) {
      try {
        const result = await callOne(c, instruction, payload, fields, long ? (c.provider === "ollama" ? 240000 : 60000) : 0);
        delete cool[c.id];
        if (failed.length && !only) toast(`⚠️ ${failed.map(f => f.who).join(", ")} busy — ${connLabel(c)} se jawab liya`);
        return {result, via:c, failed};
      } catch (e) {
        if (attempt === 0 && !only && [500, 502, 503, 504].includes(e.status)) { await sleep(700); continue; }
        if (isRetryable(e)) cool[c.id] = Date.now() + 90e3;
        failed.push({who:connLabel(c), msg:errMsg(e)});
        break;
      }
    }
  }
  const err = new Error(failed.map(f => f.who + ": " + f.msg).join(" · ")); err.all = failed; throw err;
}
const askAI = async (instruction, payload, fields, only, long) => (await askAIMeta(instruction, payload, fields, only, long)).result;

async function listModels(c) {
  let url, headers = {};
  if (c.provider === "gemini") { url = "https://generativelanguage.googleapis.com/v1beta/models?pageSize=200"; headers["x-goog-api-key"] = c.key; }
  else if (c.provider === "groq") { url = "https://api.groq.com/openai/v1/models"; headers.Authorization = "Bearer " + c.key; }
  else if (c.provider === "xai") { url = "https://api.x.ai/v1/models"; headers.Authorization = "Bearer " + c.key; }
  else url = (c.url || "http://localhost:11434").replace(/\/+$/, "") + "/api/tags";
  const res = await fetch(url, {headers, signal:AbortSignal.timeout(15000)});
  if (!res.ok) throw httpError(res.status, await res.json().catch(() => null));
  const d = await res.json();
  if (c.provider === "gemini") return (d.models || []).filter(m => (m.supportedGenerationMethods || []).includes("generateContent")).map(m => m.name.replace(/^models\//, ""));
  if (c.provider === "ollama") return (d.models || []).map(m => m.name);
  return (d.data || []).map(m => m.id);
}
function errMsg(e) {
  if (e?.name === "TimeoutError" || e?.name === "AbortError") return "Time out ho gaya.";
  if (e instanceof TypeError) return "Pahunch nahi paaye (internet / CORS / Ollama band?).";
  if (e instanceof SyntaxError) return "Jawab samajh nahi aaya.";
  return e?.message || "AI abhi available nahi hai.";
}

async function checkPred(q) {

  q.options = q.options.map(normOut); q.answer = Number(q.answer);
  if (new Set(q.options).size !== q.options.length || !(q.answer >= 0 && q.answer < q.options.length)) return false;
  const r = await runPy(q.code);
  if (r.timeout) return false;
  if (r.err) return /error/i.test(q.options[q.answer]) && q.options[q.answer].toLowerCase().includes(r.err.type.toLowerCase().replace("error", ""));
  return normOut(r.out || "") !== "" && q.options[q.answer] === normOut(r.out);
}
async function checkMcq(q) {

async function generate(cid, kinds, level, log) {
  const L = libOf(cid), title = titleOf(cid), made = {}, names = Object.fromEntries(GEN_KINDS.map(k => [k.id, k.label]));
  const C = CBY[cid];
  const topic = C ? `${C.title} (Python basics: ${C.tagline}; already taught: ${C.idea})` : title;
  if (pyState !== "ready") log("🐍 Python engine taiyaar ho raha hai (check karne ke liye)…");
  for (const [kind, n] of kinds) {
    log(`⏳ ${names[kind]} ban rahe hain…`);
    const avoid = (L[kind] || []).slice(-20).map(x => x.prompt || x.q || x.code || x.title);
    let items = [];
    try {
      const prompt = GP[kind].replace("COUNT", n).replace("TOPIC", "the given topic").replace("LEVEL", LEVEL_TXT[level] || level);
      const r = await askAI(prompt, {topic, level:LEVEL_TXT[level] || level, count:n, avoid}, null, null, true);
      items = Array.isArray(r?.items) ? r.items.slice(0, n + 1) : [];
    } catch (e) { log(`❌ ${names[kind]}: ${e.all ? "saare AI fail" : errMsg(e)}`); continue; }
    let ok = 0;
    for (const it of items) {
      let good = false;
      try {
        good = kind === "tasks" ? await checkTask(it) : kind === "preds" ? await checkPred(it) : kind === "mcqs" ? await checkMcq(it) : kind === "deeps" ? await checkDeep(it) : checkIv(it);
      } catch { good = false; }
      if (!good) continue;
      it.id = `g${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`;
      L[kind].push(it); L[kind] = L[kind].slice(-200); ok++;
      (made[kind] ||= []).push(it);
    }
    log(`${ok ? "✅" : "⚠️"} ${names[kind]}: ${ok} pass${items.length > ok ? ` · ${items.length - ok} check mein fail, hata diye` : ""}`);
  }
  save(); registerGen();
  const order = ["deeps","preds","mcqs","tasks","ivs"], cards = [];
  for (const k of order) for (const it of (made[k] || [])) cards.push(cardFor(k, it, cid));
  if (!cards.length) log("Is baar koi card check pass nahi kar paaya. Dobara try karo ya level badlo.");
  return cards;
}

const feed = $("#feed");
let current = null, sessionStart = Date.now(), breakShown = false;
const episodesIn = new Set();
function episodeCards(cid, fromStart) {
  const C = CBY[cid];
  const list = [{type:"learn1", cid, key:cid + ":learn1"}, {type:"learn2", cid, key:cid + ":learn2"},
    ...C.tasks.map(t => ({type:t.type, cid, tid:t.id, key:t.id})), {type:"test", cid, key:cid + ":test"}, {type:"next", cid}];
  if (fromStart) return list;
  const i = list.findIndex(x => x.type !== "next" && (x.type === "test" ? (S.stars[cid] || 0) < 1 : !S.done[x.key]));
  return i < 0 ? list.slice(-1) : list.slice(i);
}
function reviewCards() {
  const out = [];
  const dueQ = Object.keys(S.review).filter(id => QB[id] && S.review[id].due <= today() && QB[id].cid !== S.cur).sort((a, b) => S.review[a].due.localeCompare(S.review[b].due)).slice(0, 2);
  for (const q of dueQ) out.push({type:"review", qid:q});
  const redo = Object.keys(S.redo).find(id => TASK[id] && S.redo[id] <= today());
  if (redo) out.push({type:"redo", tid:redo, cid:TASK[redo].cid});
  return out;
}
function appendCards(list, after) {
  for (const c of list) {
    if (c.type === "next") episodesIn.add(c.cid);
    const el = RENDER[c.type](c); if (!el) continue;
    if (after) { after.after(el); after = el; } else feed.append(el);
    io.observe(el);
  }
}
const io = new IntersectionObserver(es => { for (const e of es) if (e.isIntersecting) activate(e.target); }, {root:feed, threshold:.6});
function activate(el) {
  if (current === el) return;
  if (current && !["note","next"].includes(current._c.type) && !current._done) combo = 0;
  current = el;
  const c = el._c;
  if (c.type === "note" && c.kind === "welcome" && !S.seenIntro) { S.seenIntro = true; saveSoon(); }
  if (c.type === "next" && el._refresh()) {
    const nxt = CONCEPTS[CBY[c.cid].idx + 1];
    if (nxt && !episodesIn.has(nxt.id) && el === feed.lastElementChild) {
      if (CBY[nxt.id].idx > CBY[S.cur].idx) { S.cur = nxt.id; save(); }
      appendCards(episodeCards(nxt.id, true));
    }
  }
  if (!breakShown && Date.now() - sessionStart > 25 * 60e3) { breakShown = true; appendCards([{type:"note", kind:"break"}], el); }
}
function startFeed(cid, fromStart) {
  feed.innerHTML = ""; episodesIn.clear(); current = null;
  const list = [];
  if (!S.seenIntro) list.push({type:"note", kind:"welcome"});
  if (!fromStart) list.push(...reviewCards());
  list.push(...episodeCards(cid, fromStart));
  appendCards(list); feed.scrollTop = 0;
}

feed.addEventListener("focusout", () => setTimeout(() => { if (!feed.contains(document.activeElement) || !document.activeElement.matches("textarea,input")) feed.classList.remove("typing"); }, 300));

});

  const prov = $("#cProv"), sync = () => { const o = prov.value === "ollama"; $("#cUrlBox").hidden = !o; $("#cKeyBox").hidden = o;
    $("#cKey").placeholder = PROVIDERS[prov.value].keyHint; $("#cModel").placeholder = PROVIDERS[prov.value].def || "Models dikhao dabao"; $("#cModels").innerHTML = ""; };
  prov.value = AIS.list.length ? "groq" : "gemini"; sync(); prov.onchange = sync;
  $("#aiRemember").onchange = e => { AIS.remember = e.target.checked; persistAI(); };
  $("#cList").onclick = fillModels;
  $("#cAdd").onclick = addConn;
  $("#cTestAll").onclick = testAll;

  $("#exBtn").onclick = exportData; $("#imBtn").onclick = () => $("#imFile").click(); $("#imFile").onchange = importData;
}
const aiNote = t => { const n = $("#aiNote"); if (n) n.textContent = t; };
function draftConn() {
  const provider = $("#cProv").value;
  return {id:"c" + Date.now(), provider, key:$("#cKey").value.trim().replace(/^["']|["']$/g, ""),
    model:$("#cModel").value.trim().replace(/^models\//, ""), url:$("#cUrl").value.trim() || "http://localhost:11434"};
}
function renderConns() {
  const ul = $("#connList"); if (!ul) return;
  ul.innerHTML = AIS.list.length ? AIS.list.map((c, i) => `<li>
<p class="strong">${i + 1}. ${esc(connLabel(c))}</p>
<p class="muted small">${c.provider === "ollama" ? esc(c.url) : "Key …" + esc(c.key.slice(-4))}${(cool[c.id] || 0) > Date.now() ? " · abhi busy, baad mein try hoga" : ""}</p>
<div class="row"><button class="btn tiny" data-a="up" data-i="${i}" ${i ? "" : "disabled"}>▲</button><button class="btn tiny" data-a="down" data-i="${i}" ${i < AIS.list.length - 1 ? "" : "disabled"}>▼</button>
<button class="btn tiny" data-a="test" data-i="${i}">Test</button><button class="btn tiny" data-a="del" data-i="${i}">Hatao</button></div></li>`).join("")
    : `<li><p class="muted">Abhi koi AI nahi juda — offline check chal raha hai. Neeche se jodo.</p></li>`;
  ul.querySelectorAll("button[data-a]").forEach(b => b.onclick = async () => {
    const i = +b.dataset.i, L = AIS.list;
    if (b.dataset.a === "up") [L[i - 1], L[i]] = [L[i], L[i - 1]];
    if (b.dataset.a === "down") [L[i + 1], L[i]] = [L[i], L[i + 1]];
    if (b.dataset.a === "del") L.splice(i, 1);
    if (b.dataset.a === "test") { b.disabled = true; aiNote("Test ho raha hai: " + connLabel(L[i]) + "…");
      try { await askAI(TEST_PROMPT, {test:"connection"}, ["status"], L[i]); delete cool[L[i].id]; aiNote("✅ " + connLabel(L[i]) + " chal raha hai."); }
      catch (e) { aiNote("❌ " + connLabel(L[i]) + ": " + errMsg(e)); } b.disabled = false; return; }
    persistAI(); renderConns();
  });
}
const TEST_PROMPT = 'Return a JSON object with one string field named "status" set to "ok".';
async function fillModels() {
  const c = draftConn();
  if (c.provider !== "ollama" && !c.key) { aiNote("Pehle key paste karo, phir Models dikhao."); return; }
  aiNote("Models la raha hoon…");
  try {
    const ms = await listModels(c);
    $("#cModels").innerHTML = ms.map(m => `<option value="${esc(m)}">`).join("");
    aiNote(ms.length ? `${ms.length} models mile. Model box mein click karke chuno.` : "Koi model nahi mila.");
    if (!$("#cModel").value && ms.length && !PROVIDERS[c.provider].def) $("#cModel").value = ms[0];
  } catch (e) { aiNote("❌ Models nahi aaye: " + errMsg(e)); }
}
async function addConn() {
  const c = draftConn(), P = PROVIDERS[c.provider];
  if (P.keyRe && !P.keyRe.test(c.key)) { aiNote(`${P.label} ki poori key paste karo (${P.keyHint}).`); return; }
  if (AIS.list.some(x => x.provider === c.provider && x.key === c.key && modelOf(x) === modelOf(c) && x.url === c.url)) { aiNote("Yeh connection pehle se juda hai."); return; }
  const btn = $("#cAdd"); btn.disabled = true; aiNote("Test ho raha hai…");
  try {
    if (!modelOf(c)) { const ms = await listModels(c); if (!ms.length) throw new Error("Koi model nahi mila."); c.model = ms[0]; }
    await askAI(TEST_PROMPT, {test:"connection"}, ["status"], c);
    AIS.list.push(c); AIS.remember = $("#aiRemember").checked; persistAI();
    $("#cKey").value = ""; $("#cModel").value = "";
    aiNote(`✅ Jud gaya: ${connLabel(c)} (number ${AIS.list.length} par).`); renderConns();
  } catch (e) { aiNote("❌ " + errMsg(e)); }
  finally { btn.disabled = false; }
}
async function testAll() {
  if (!AIS.list.length) { aiNote("Pehle koi connection jodo."); return; }
  aiNote("Sab test ho rahe hain…"); const out = [];
  for (const c of AIS.list) {
    try { await askAI(TEST_PROMPT, {test:"connection"}, ["status"], c); delete cool[c.id]; out.push("✅ " + connLabel(c)); }
    catch (e) { out.push("❌ " + connLabel(c) + " — " + errMsg(e)); }
  }
  aiNote(out.join("  |  ")); renderConns();
}


function exportData() {
  const blob = new Blob([JSON.stringify(S, null, 1)], {type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `jugaad-python-backup-${today()}.json`;
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function importData(e) {
  const f = e.target.files?.[0]; if (!f) return;
  f.text().then(t => { const o = JSON.parse(t);
    if (!o || typeof o.xp !== "number" || typeof o.stars !== "object") throw new Error("bad");
    if (!confirm("Is backup se abhi ka progress replace ho jaayega. Theek hai?")) return;
    S = Object.assign(JSON.parse(JSON.stringify(DEFAULT)), o); save(); location.reload();
  }).catch(() => toast("Yeh file sahi backup nahi lag rahi."));
}

registerGen();
dayRoll(); hud(); startWorker();
startFeed(S.cur, false);
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
